<h1>Select Governorate and Area</h1>
<form action="details.php" method="get">
  <!-- Governorates -->
  <label><input type="radio" name="governorate" value="cairo" onclick="showAreas('cairo')"> Cairo</label><br>
  <label><input type="radio" name="governorate" value="giza" onclick="showAreas('giza')"> Giza</label><br>
  <label><input type="radio" name="governorate" value="alex" onclick="showAreas('alex')"> Alexandria</label><br>

  <!-- Cairo Areas -->
  <div id="cairo-areas" style="display:none; margin-top:10px;">
    <h3>Cairo Areas</h3>
    <label><input type="radio" name="area" value="shoubra"> Shoubra</label><br>
    <label><input type="radio" name="area" value="sheraton"> Sheraton</label><br>
    <label><input type="radio" name="area" value="heliopolis"> Heliopolis</label><br>
  </div>

  <!-- Giza Areas -->
  <div id="giza-areas" style="display:none; margin-top:10px;">
    <h3>Giza Areas</h3>
    <label><input type="radio" name="area" value="faisal"> Faisal</label><br>
  </div>

  <!-- Alexandria Areas -->
  <div id="alex-areas" style="display:none; margin-top:10px;">
    <h3>Alexandria Areas</h3>
    <label><input type="radio" name="area" value="miami"> Miami</label><br>
    <label><input type="radio" name="area" value="mandara"> Mandara</label><br>
  </div>

  <button type="submit">Next</button>
</form>

<script>
function showAreas(gov) {
  // Hide all areas first
  document.getElementById('cairo-areas').style.display = 'none';
  document.getElementById('giza-areas').style.display = 'none';
  document.getElementById('alex-areas').style.display = 'none';

  // Show only the selected governorate's areas
  document.getElementById(gov + '-areas').style.display = 'block';
}
</script>
